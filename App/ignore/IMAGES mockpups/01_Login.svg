<svg width="920" height="680" viewBox="0 0 920 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#003884" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-outfit { font-family: 'Outfit', sans-serif; }
  </style>

  <rect width="920" height="680" rx="24" fill="url(#bgGrad)"/>

  <!-- LOGIN CARD -->
  <g id="Login_Card" transform="translate(252, 50)">
    <rect width="416" height="570" rx="24" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- LOGO BOX -->
    <rect x="176" y="40" width="64" height="64" rx="18" fill="#0058BC"/>
    <g transform="translate(192, 56)">
      <rect x="2" y="2" width="28" height="28" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="16" cy="18" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="10" cy="8" r="1.5" fill="#FFFFFF"/>
    </g>

    <text x="208" y="148" class="font-outfit" font-size="12" font-weight="700" fill="#0058BC" letter-spacing="1.5" text-anchor="middle">LAVANDERIAS VILLAS DEL SUR</text>
    
    <text x="208" y="188" class="font-outfit" font-size="26" font-weight="800" fill="#0F172A" text-anchor="middle">Iniciar Sesión</text>
    <text x="208" y="214" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Accede a tu panel de control de la lavanderia</text>

    <!-- USUARIO -->
    <g transform="translate(32, 244)">
      <text x="0" y="0" class="font-outfit" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.8">USUARIO</text>
      <rect x="0" y="10" width="352" height="52" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="24" cy="36" r="6" fill="none" stroke="#64748B" stroke-width="1.8"/>
      <path d="M 16 44 C 16 39 32 39 32 44" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <text x="44" y="41" font-size="14" fill="#94A3B8">Nombre de usuario</text>
    </g>

    <!-- CONTRASEÑA -->
    <g transform="translate(32, 334)">
      <text x="0" y="0" class="font-outfit" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.8">CONTRASEÑA</text>
      <rect x="0" y="10" width="352" height="52" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="18" y="30" width="12" height="10" rx="2" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <path d="M 21 30 V 27 C 21 24 27 24 27 27 V 30" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <text x="44" y="44" font-size="16" fill="#94A3B8" letter-spacing="3">••••••••</text>
      
      <!-- Eye Icon -->
      <path d="M 320 36 C 324 32 332 32 336 36 C 332 40 324 40 320 36 Z" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <circle cx="328" cy="36" r="2" fill="#64748B"/>
    </g>

    <!-- BUTTON -->
    <g transform="translate(32, 440)">
      <rect width="352" height="52" rx="14" fill="#0058BC"/>
      <text x="160" y="32" class="font-outfit" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1">INGRESAR</text>
      <path d="M 215 32 H 230 M 224 26 L 230 32 L 224 38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>