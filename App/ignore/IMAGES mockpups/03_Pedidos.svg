<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#002B66" flood-opacity="0.05"/>
    </filter>
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0058BC" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
    
    text { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-outfit { font-family: 'Outfit', sans-serif; }
  </style>

  <!-- APP BACKGROUND CANVAS -->
  <rect width="1440" height="900" fill="#F4F7FC"/>

  <!-- SIDEBAR (WIDTH 260px) -->
  <g id="Sidebar">
    <rect width="260" height="900" fill="#F8FAFC"/>
    <line x1="260" y1="0" x2="260" y2="900" stroke="#E2E8F0" stroke-width="1"/>

    <!-- LOGO AREA -->
    <g transform="translate(24, 24)">
      <rect width="40" height="40" rx="12" fill="#0058BC"/>
      <!-- Washing Machine Icon SVG -->
      <g transform="translate(10, 10)">
        <rect x="2" y="2" width="16" height="16" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="10" cy="11" r="4.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
        <circle cx="6" cy="5" r="1" fill="#FFFFFF"/>
      </g>
      <text x="52" y="20" class="font-outfit" font-size="15" font-weight="800" fill="#0F172A">Lavanderias</text>
      <text x="52" y="34" class="font-outfit" font-size="11" font-weight="600" fill="#0058BC">villas del sur</text>
    </g>

    <!-- NAV ITEMS -->
    <g transform="translate(16, 96)">
      <!-- General -->
      <g transform="translate(0, 0)">
        <rect width="228" height="42" rx="10" fill="transparent"/>
        <path d="M 16 14 H 26 V 24 H 16 Z M 28 14 H 38 V 24 H 28 Z M 16 26 H 26 V 36 H 16 Z M 28 26 H 38 V 36 H 28 Z" fill="#5B6B7C" opacity="0.9"/>
        <text x="46" y="26" font-size="14" fill="#5B6B7C" font-weight="500">General</text>
      </g>

      <!-- Pedidos -->
      <g transform="translate(0, 50)">
        <rect width="228" height="42" rx="10" fill="#E8F2FF"/>
        <path d="M 16 14 H 38 V 34 H 16 Z M 20 18 H 34" stroke="#0058BC" stroke-width="2" fill="none"/>
        <text x="46" y="26" font-size="14" fill="#0058BC" font-weight="700">Pedidos</text>
      </g>

      <!-- Clientes -->
      <g transform="translate(0, 100)">
        <rect width="228" height="42" rx="10" fill="transparent"/>
        <circle cx="23" cy="20" r="4" fill="#5B6B7C"/>
        <path d="M 16 32 C 16 26 30 26 30 32" stroke="#5B6B7C" stroke-width="2" fill="none"/>
        <text x="46" y="26" font-size="14" fill="#5B6B7C" font-weight="500">Clientes</text>
      </g>

      <!-- Empleados -->
      <g transform="translate(0, 150)">
        <rect width="228" height="42" rx="10" fill="transparent"/>
        <circle cx="27" cy="20" r="4" fill="#5B6B7C"/>
        <path d="M 20 32 C 20 26 34 26 34 32" stroke="#5B6B7C" stroke-width="2" fill="none"/>
        <text x="46" y="26" font-size="14" fill="#5B6B7C" font-weight="500">Empleados</text>
      </g>

      <!-- Finanzas -->
      <g transform="translate(0, 200)">
        <rect width="228" height="42" rx="10" fill="transparent"/>
        <rect x="16" y="16" width="22" height="16" rx="3" stroke="#5B6B7C" stroke-width="2" fill="none"/>
        <text x="46" y="26" font-size="14" fill="#5B6B7C" font-weight="500">Finanzas</text>
      </g>

      <!-- Inventario -->
      <g transform="translate(0, 250)">
        <rect width="228" height="42" rx="10" fill="transparent"/>
        <rect x="16" y="16" width="22" height="18" rx="2" stroke="#5B6B7C" stroke-width="2" fill="none"/>
        <text x="46" y="26" font-size="14" fill="#5B6B7C" font-weight="500">Inventario</text>
      </g>
    </g>

    <!-- LOGOUT BUTTON -->
    <g transform="translate(20, 830)">
      <path d="M 24 12 H 14 V 28 H 24 M 20 20 H 32 M 28 15 L 33 20 L 28 25" stroke="#E53935" stroke-width="2" fill="none"/>
      <text x="42" y="25" font-size="14" font-weight="700" fill="#E53935">Cerrar Sesión</text>
    </g>
  </g>

  <!-- TOP NAVBAR -->
  <g id="TopNavbar" transform="translate(260, 0)">
    <rect width="1180" height="64" fill="#F8FAFC"/>
    <line x1="0" y1="64" x2="1180" y2="64" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Search Box -->
    <g transform="translate(32, 12)">
      <rect width="360" height="40" rx="20" fill="#EDF2F7"/>
      <circle cx="24" cy="20" r="5" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <line x1="28" y1="24" x2="33" y2="29" stroke="#64748B" stroke-width="1.8"/>
      <text x="42" y="25" font-size="13" fill="#64748B">Buscar pedidos, máquinas o clientes...</text>
    </g>

    <!-- Right Controls -->
    <g transform="translate(950, 14)">
      <!-- Bell -->
      <path d="M 18 10 C 18 6 24 6 24 10 V 18 L 14 22 H 28 L 24 18 V 10" stroke="#475569" stroke-width="2" fill="none"/>
      <circle cx="25" cy="8" r="4" fill="#EF4444"/>

      <!-- Clock -->
      <g transform="translate(48, 0)">
        <circle cx="18" cy="16" r="8" stroke="#475569" stroke-width="2" fill="none"/>
        <path d="M 18 12 V 16 L 21 19" stroke="#475569" stroke-width="2"/>
      </g>

      <line x1="96" y1="4" x2="96" y2="32" stroke="#CBD5E1" stroke-width="1"/>

      <text x="112" y="16" font-size="13" font-weight="700" fill="#0F172A">Administrador</text>
      <text x="112" y="30" font-size="11" font-weight="600" fill="#64748B">ADMIN</text>
      <circle cx="196" cy="18" r="16" fill="#E2E8F0"/>
    </g>
  </g>

  <!-- MAIN CONTENT AREA -->
  <g id="MainContent" transform="translate(292, 88)">
    
<text x="0" y="28" class="font-outfit" font-size="24" font-weight="800" fill="#0F172A">Gestión de pedidos</text>
<g transform="translate(600, 0)">
  <rect width="110" height="38" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="55" y="24" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Filtrar</text>
</g>

<g transform="translate(0, 52)">
  <rect width="710" height="700" rx="20" fill="#FFFFFF" filter="url(#softShadow)"/>

  <g transform="translate(20, 20)">
    <!-- Pedido 1 -->
    <g transform="translate(0, 0)">
      <rect width="670" height="84" rx="14" fill="#EFF6FF" stroke="#0058BC" stroke-width="1.5"/>
      <rect x="16" y="16" width="52" height="52" rx="12" fill="#DBEAFE"/>
      <text x="84" y="42" class="font-outfit" font-size="16" font-weight="800" fill="#0F172A">Pedido #1</text>
      <text x="84" y="60" font-size="13" fill="#64748B">yadier de jesus pech tun • 16.0 kg</text>
      <rect x="540" y="28" width="114" height="28" rx="14" fill="#34A853"/>
      <text x="597" y="47" class="font-outfit" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">ENTREGADO</text>
    </g>

    <!-- Pedido 2 -->
    <g transform="translate(0, 96)">
      <rect width="670" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="16" y="16" width="52" height="52" rx="12" fill="#F1F5F9"/>
      <text x="84" y="42" class="font-outfit" font-size="16" font-weight="700" fill="#0F172A">Pedido #2</text>
      <text x="84" y="60" font-size="13" fill="#64748B">yadier de jesus pech tun • 16.9 kg</text>
      <rect x="540" y="28" width="114" height="28" rx="14" fill="#34A853"/>
      <text x="597" y="46" class="font-outfit" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">ENTREGADO</text>
    </g>

    <!-- Button -->
    <g transform="translate(160, 220)">
      <rect width="350" height="52" rx="26" fill="#0058BC" filter="url(#btnShadow)"/>
      <text x="175" y="32" class="font-outfit" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">+ Registrar pedido</text>
    </g>
  </g>

  <!-- Right Details Card (Exact Captura 145228) -->
  <g transform="translate(730, 0)">
    <rect width="360" height="700" rx="20" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect width="360" height="96" rx="20" fill="url(#cardGrad)"/>
    <text x="24" y="42" class="font-outfit" font-size="22" font-weight="800" fill="#FFFFFF">Detalles</text>
    <text x="24" y="64" font-size="13" font-weight="600" fill="#E0F2FE">Pedidos</text>

    <g transform="translate(24, 116)">
      <text x="0" y="14" class="font-outfit" font-size="10" font-weight="700" fill="#64748B">CLIENTE</text>
      <text x="312" y="14" font-size="13" font-weight="700" fill="#0F172A" text-anchor="end">yadier de jesus pech tun</text>
      <line x1="0" y1="26" x2="312" y2="26" stroke="#F1F5F9" stroke-width="1"/>

      <g transform="translate(0, 36)">
        <text x="0" y="14" class="font-outfit" font-size="10" font-weight="700" fill="#64748B">DÍA</text>
        <text x="312" y="14" font-size="13" fill="#0F172A" text-anchor="end">26 may, 2026</text>
        <line x1="0" y1="26" x2="312" y2="26" stroke="#F1F5F9" stroke-width="1"/>
      </g>

      <g transform="translate(0, 72)">
        <text x="0" y="14" class="font-outfit" font-size="10" font-weight="700" fill="#64748B">HORA RECEPCIÓN</text>
        <text x="312" y="14" font-size="13" fill="#0F172A" text-anchor="end">10:06 a. m.</text>
        <line x1="0" y1="26" x2="312" y2="26" stroke="#F1F5F9" stroke-width="1"/>
      </g>

      <g transform="translate(0, 108)">
        <text x="0" y="14" class="font-outfit" font-size="10" font-weight="700" fill="#64748B">MÁQUINA</text>
        <text x="312" y="14" font-size="13" font-weight="600" fill="#0F172A" text-anchor="end">Lavadora #01</text>
        <line x1="0" y1="26" x2="312" y2="26" stroke="#F1F5F9" stroke-width="1"/>
      </g>

      <g transform="translate(0, 144)">
        <text x="0" y="14" class="font-outfit" font-size="10" font-weight="700" fill="#64748B">PESO</text>
        <text x="312" y="14" font-size="13" font-weight="600" fill="#0F172A" text-anchor="end">16.0 kg</text>
        <line x1="0" y1="26" x2="312" y2="26" stroke="#F1F5F9" stroke-width="1"/>
      </g>

      <g transform="translate(0, 180)">
        <text x="0" y="14" class="font-outfit" font-size="10" font-weight="700" fill="#64748B">COSTO</text>
        <text x="312" y="14" class="font-outfit" font-size="16" font-weight="800" fill="#0058BC" text-anchor="end">$256.00</text>
        <line x1="0" y1="26" x2="312" y2="26" stroke="#F1F5F9" stroke-width="1"/>
      </g>

      <g transform="translate(0, 216)">
        <text x="0" y="14" class="font-outfit" font-size="10" font-weight="700" fill="#64748B">OTROS SERVICIOS</text>
        <text x="312" y="14" font-size="12" font-weight="600" fill="#0F172A" text-anchor="end">Lavado + Secado Express</text>
        <line x1="0" y1="26" x2="312" y2="26" stroke="#F1F5F9" stroke-width="1"/>
      </g>

      <g transform="translate(0, 252)">
        <text x="0" y="14" class="font-outfit" font-size="10" font-weight="700" fill="#64748B">EMPLEADO</text>
        <text x="312" y="14" font-size="13" fill="#0F172A" text-anchor="end">Administrador</text>
        <line x1="0" y1="26" x2="312" y2="26" stroke="#F1F5F9" stroke-width="1"/>
      </g>

      <g transform="translate(0, 288)">
        <text x="0" y="14" class="font-outfit" font-size="10" font-weight="700" fill="#64748B">HORA ENTREGA</text>
        <text x="312" y="14" font-size="13" fill="#0F172A" text-anchor="end">10:06 a. m.</text>
        <line x1="0" y1="26" x2="312" y2="26" stroke="#F1F5F9" stroke-width="1"/>
      </g>

      <!-- Cyan Button -->
      <g transform="translate(0, 340)">
        <rect width="312" height="42" rx="14" fill="#00C6FF"/>
        <text x="156" y="26" class="font-outfit" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Estado del pedido</text>

        <!-- Light cyan button -->
        <g transform="translate(0, 52)">
          <rect width="312" height="42" rx="14" fill="#E0F7FA"/>
          <text x="156" y="26" font-size="13" font-weight="600" fill="#00838F" text-anchor="middle">✎ Editar pedido</text>
        </g>
      </g>

      <!-- Bright Green Button -->
      <g transform="translate(0, 470)">
        <rect width="312" height="46" rx="23" fill="#76FF03"/>
        <text x="156" y="28" class="font-outfit" font-size="14" font-weight="800" fill="#1B5E20" text-anchor="middle">Finalizar pedido</text>
      </g>
    </g>
  </g>
</g>

  </g>
</svg>