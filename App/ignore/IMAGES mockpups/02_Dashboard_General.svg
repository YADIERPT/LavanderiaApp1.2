      <text x="0" y="6" class="font-outfit" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle">34</text>
      <text x="0" y="20" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">PEDIDOS</text>
