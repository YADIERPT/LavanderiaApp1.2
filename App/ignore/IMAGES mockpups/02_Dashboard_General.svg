      <text x="112" y="30" font-size="11" font-weight="600" fill="#64748B">ADMIN</text>
      <circle cx="196" cy="18" r="16" fill="#E2E8F0"/>
    </g>
  </g>

  <!-- MAIN CONTENT AREA -->
  <g id="MainContent" transform="translate(292, 88)">
    
<text x="0" y="24" class="font-outfit" font-size="24" font-weight="800" fill="#0F172A">Resumen del dia</text>
<text x="0" y="44" font-size="13" fill="#64748B">Estado en tiempo real de su ecosistema de lavandería.</text>

<g transform="translate(900, 8)">
